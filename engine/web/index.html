<title>Острог</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap">
<style>
/* Полноэкранная игра: холст на весь экран, поверх — заставка загрузки до старта движка. Одна ночная тема намеренно. */
:root {
  --night: #120c22;
  --night-2: #1d1435;
  --ink: #f3e6c8;
  --dim: #a294c4;
  --gold: #ffc86b;
  --ember: #ff8a4c;
  --display: "Rubik", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--ink); }
body { font-family: var(--display); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; background: var(--night); }
#loader {
  position: fixed; inset: 0; display: grid; place-items: center; z-index: 2;
  background: radial-gradient(ellipse at 50% 42%, var(--night-2) 0%, var(--night) 68%);
  transition: opacity .6s ease;
}
#loader.gone { opacity: 0; pointer-events: none; }
.stack { display: grid; justify-items: center; gap: 18px; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); text-align: center; }
.flame {
  width: 46px; height: 64px; border-radius: 50% 50% 46% 46% / 62% 62% 38% 38%;
  background: radial-gradient(circle at 50% 70%, #fff6d8 0%, var(--gold) 38%, var(--ember) 72%, transparent 74%);
  box-shadow: 0 0 60px 18px rgba(255, 180, 90, .35);
  animation: flicker 1.6s ease-in-out infinite;
}
@keyframes flicker { 0%, 100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.07, .95) rotate(2deg); } }
@media (prefers-reduced-motion: reduce) { .flame { animation: none; } }
h1 { margin: 0; font-size: clamp(30px, 6vw, 46px); letter-spacing: .08em; color: var(--gold); text-wrap: balance; font-weight: 800; }
.motto { margin: -8px 0 0; color: var(--dim); font-size: 16px; }
.track { width: min(320px, 70vw); height: 10px; border-radius: 6px; background: #2b2047; overflow: hidden; box-shadow: inset 0 1px 3px #0008; }
.fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--ember), var(--gold)); transition: width .25s ease; }
#status { min-height: 1.4em; color: var(--dim); font-size: 15px; font-variant-numeric: tabular-nums; }
#error { max-width: 34em; color: #ffb3a8; font-size: 15px; line-height: 1.45; }
</style>

<canvas id="canvas" tabindex="-1" aria-label="Острог"></canvas>
<div id="loader">
  <div class="stack">
    <div class="flame" aria-hidden="true"></div>
    <h1>ОСТРОГ</h1>
    <p class="motto">Летопись Тихой реки</p>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div id="status">Разжигаем фонарь…</div>
    <div id="error" hidden></div>
  </div>
</div>

<script>
  var loader = document.getElementById('loader');
  var fill = document.getElementById('fill');
  var statusEl = document.getElementById('status');
  var errorEl = document.getElementById('error');
  function fail(msg) {
    errorEl.hidden = false;
    errorEl.textContent = 'Игра не запустилась: ' + msg + '. Обнови страницу; если не поможет — открой её в Safari или Chrome последней версии.';
    statusEl.textContent = '';
  }
  var Module = {
    canvas: document.getElementById('canvas'),
    setStatus: function (text) {
      var m = /\((\d+(?:\.\d+)?)\/(\d+)\)/.exec(text || '');
      if (m) {
        var done = +m[1], total = +m[2];
        fill.style.width = (total ? 100 * done / total : 0).toFixed(1) + '%';
        statusEl.textContent = 'Загрузка ' + (done / 1048576).toFixed(1) + ' из ' + (total / 1048576).toFixed(1) + ' МБ';
      } else if (text) {
        statusEl.textContent = 'Почти готово…';
      }
    },
    onRuntimeInitialized: function () {
      fill.style.width = '100%';
      setTimeout(function () { loader.classList.add('gone'); }, 250);
      setTimeout(function () { loader.hidden = true; }, 900);
    },
    onAbort: function (what) { fail(String(what)); },
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); }
  };
  window.addEventListener('error', function (e) { if (!loader.hidden) fail(e.message || 'ошибка загрузки'); });
  if (!document.createElement('canvas').getContext('webgl2')) fail('браузер не поддерживает WebGL 2');
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
</script>
<script src="lanternfall.js"></script>
